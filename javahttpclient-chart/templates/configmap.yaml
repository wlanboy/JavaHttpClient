apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.deploymentname }}-config
data:
  application.properties: |
    # Endpoints
    management.endpoints.web.exposure.include=prometheus,health,info,metrics
    management.endpoint.health.show-details=always
    # Buildinfo
    spring.config.import=classpath:META-INF/build-info.properties
    # Tracing
    management.tracing.propagation.type=w3c,b3
    # Fehler-Responses
    httpclient.error.include-stacktrace={{ .Values.errors.includeStacktrace }}
