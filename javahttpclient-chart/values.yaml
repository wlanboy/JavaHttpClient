image:
  repository: wlanboy/javahttpclient
  tag: latest
  pullPolicy: Always

replicaCount: 1
deploymentname: javahttpclient
namespace: clients

service:
  name: javahttpclient-svc
  type: ClusterIP
  port: 8080
  targetPort: 8080

volume:
  mountPath: /tmp

hosts: 
  - javahttpclient.tp.lan
  - javahttpclient.gmk.lan
  - javahttpclient.localhost

istio:
  gatewayName: javahttpclient-gw
  gatewayNamespace: "istio-ingress"
  tls:
    enabled: true
    secretName: javahttpclient-tls

certManager:
  enabled: true
  issuerRef:
    kind: ClusterIssuer
    name: "local-ca-issuer"
  dnsNames:
    - javahttpclient.tp.lan
    - javahttpclient.gmk.lan
    - javahttpclient.localhost

extraVolumeMounts: []
extraVolumes: []
extraEnv: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
