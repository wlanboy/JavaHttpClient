springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Virtual Threads: Requests warten blockierend auf externe Ziele
spring.threads.virtual.enabled=true

# Endpoints
management.endpoints.web.exposure.include=health,info,prometheus

# Stacktrace im 502-Response (fuer Debugging; bei oeffentlich erreichbaren Deployments abschalten)
httpclient.error.include-stacktrace=true

# Limits gegen OOM bei 256Mi-Container: groessere Responses werden gekuerzt (Header X-Body-Truncated),
# groessere Envoy config_dumps werden nicht geparst
httpclient.response.max-body-size=5MB
istio.envoy.config-dump.max-size=5MB

# Envoy Admin API (ENVOY_ADMIN_URL bleibt als Env-Variable unterstuetzt) und Port des
# pilot-agent Status-Endpoints fuer die Sidecar-Erkennung (Host wird aus der Admin-URL uebernommen)
istio.envoy.admin-url=${ENVOY_ADMIN_URL:http://127.0.0.1:15000}
istio.sidecar.status-port=15021
